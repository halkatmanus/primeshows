plugins { id 'com.android.application' }

android {
    namespace 'org.primeshows.tv'
    compileSdk 34
    defaultConfig {
        applicationId 'org.primeshows.tv'
        minSdk 21          // Android 11 TV (API 30) is well above this
        targetSdk 30       // matches the TV; avoids newer-OS restrictions
        versionCode 1
        versionName '1.0'
        // No native code: this APK runs on armeabi-v7a (armv7a) as-is.
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
